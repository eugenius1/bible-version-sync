name: CI

on:
  push:
    branches: [main]
  # Every PR, including ones stacked on another PR's branch.
  pull_request:

# A new push to the same ref supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Checking out and testing needs nothing more; a compromised dependency or
# action then gets a token that can't push or touch releases.
permissions:
  contents: read
  # Codecov authenticates the upload with a GitHub OIDC token, not a secret.
  id-token: write

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24 ships npm 11; npm 10 crashes resolving this workspace's peers.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Bundled data is up to date
        run: |
          npm run gen -w @bvs/core
          git diff --exit-code packages/core/src/data.generated.ts

      - run: npm run lint

      - run: npm run typecheck

      - name: Test with coverage
        run: npm run coverage

      - run: npm run build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          # One report for both workspaces; codecov.yml splits it by path.
          files: coverage/lcov.info
          fail_ci_if_error: false
