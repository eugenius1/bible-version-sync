name: CI

on:
  push:
    branches: [main]
  # Every PR, including ones stacked on another PR's branch.
  pull_request:

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11; npm 10 crashes resolving this workspace's peers.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Bundled data is up to date
        run: |
          npm run gen -w @bvs/core
          git diff --exit-code packages/core/src/data.generated.ts

      - run: npm run typecheck

      - name: Test with coverage
        run: npm run coverage

      - run: npm run build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/core/coverage/lcov.info,apps/pwa/coverage/lcov.info
          fail_ci_if_error: false
